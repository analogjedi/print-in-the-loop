schema_version: 1
project_id: bldc_2804_plate_v1
design_type: bldc_pinned_plate
release_class: kinematic_demonstrator
length_unit: mm
# Second motor plate for the printed stand tower (the tower is reused, not reprinted).
stand_spec: specs/bldc_4015_stand_v1.yaml
# Jamie, 2026-10-27: 2804 hollow-shaft outrunner with the AS5600 encoder kit. Supplier
# drawing nominals (components/drawings/bldc_2804/), no tolerances given; not measured.
motor_reference: 2804 BLDC hollow shaft outrunner, AS5600 kit (components/drawings/bldc_2804)
motor_diameter_mm: 34.5
motor_body_height_mm: 15.0
# Stator ring: 15 - 11 per the side view; the rotor cup is the other 11 mm.
motor_stationary_height_mm: 4.0
# Ø12 boss 4.5 mm proud of the stator face (19.5 - 15) holding the radial encoder magnet;
# treated as rotating over its whole height.
motor_boss_diameter_mm: 12.0
motor_boss_height_mm: 4.5
shaft_bore_mm: 6.5
# Stator face: 4 x M2.5 on Ø19 at 45 degrees (13.4 spacing), max 4 mm screw depth;
# Ø2 x 4 deep locating hole 14 from center. The stator end view is drawn looking AT the
# stator face (from below in this frame): hole at 9 o'clock, lead tab at 12 o'clock.
# Seen from the rotor side (+Z, this frame) that mirrors to hole at 0 deg, lead at 90 deg.
stator_hole_circle_mm: 19.0
stator_thread_depth_mm: 4.0
locating_hole_diameter_mm: 2.0
locating_hole_depth_mm: 4.0
locating_hole_radius_mm: 14.0
locating_hole_angle_deg: 0.0
lead_angle_deg: 90.0
# Plate: same Ø90 footprint and M3 screws as the 4015 plate, on the existing tower.
plate_diameter_mm: 90.0
floor_thickness_mm: 2.5
pocket_depth_mm: 2.5
pocket_diametral_clearance_mm: 0.3
center_opening_mm: 27.0
# Printed pin into the locating hole; if it shears, drill it out and fit 2 mm rod.
pin_diameter_mm: 1.8
pin_height_mm: 3.0
pin_tab_width_mm: 4.0
pin_tab_inner_radius_mm: 12.0
# Crush ribs grip the stator ring (proposed interference; not calibrated on this printer).
rib_count: 6
rib_radius_mm: 0.75
rib_interference_mm: 0.15
# Lead tab reads about 2.6 mm wide on the drawing; envelope and notch are generous.
lead_notch_width_mm: 7.0
lead_notch_outer_radius_mm: 30.0
lead_envelope_width_mm: 5.0
# Jamie's M3 x 10 from the 4015 plate: 5 mm into the tower's tapped pilots.
plate_screw_length_mm: 10.0
rotor_radial_clearance_mm: 3.0
boss_clearance_mm: 1.0
# Encoder kit: same 33 x 33 AS5600 board, mounted on one diagonal pair of stator holes
# through its center slots, chip toward the magnet, connectors away (5.4 mm). The kit's
# motor-to-board spacing is not known; the boss plus chip imply about 6.2 mm or more.
# The plate is checked over 4.5 to 10 mm; the review shows 7 mm for illustration only.
encoder_board_max_square_mm: 53.0
encoder_standoff_min_mm: 4.5
encoder_standoff_max_mm: 10.0
encoder_review_standoff_mm: 7.0
encoder_pcb_thickness_mm: 1.6
encoder_chip_side_height_mm: 1.7
encoder_chip_side_radius_mm: 15.0
encoder_below_pcb_depth_mm: 25.0
encoder_standoff_hex_corner_mm: 5.8
trial_assumptions_authorized: true
process_compensation_mm: 0.0
