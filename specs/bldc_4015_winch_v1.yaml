# length (and so the magnet gap) is chosen by Jamie per board; not set here.
magnet_diameter_mm: 6.0
magnet_thickness_mm: 2.5
magnet_pocket_clearance_mm: 0.1
magnet_holder_diameter_mm: 10.0
magnet_holder_gap_mm: 1.2
magnet_holder_shaft_engagement_mm: 4.5
encoder_pilot_circle_mm: 28.0
encoder_pilot_count: 8
encoder_pilot_mm: 2.1
encoder_board_max_square_mm: 53.0
encoder_envelope_height_mm: 25.0
trial_assumptions_authorized: true
process_compensation_mm: 0.0
